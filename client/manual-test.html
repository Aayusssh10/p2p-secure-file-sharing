<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>WebRTC Peer Client — Manual Test Harness</title>
</head>
<body>
<p><em>Temporary dev harness for Phase 3 (WebRTC Peer Connection Layer). Not the real UI — that's Phase 4.</em></p>
<h3>Room: <span id="room"></span></h3>
<p>Status: <span id="status">idle</span></p>
<input type="file" id="fileInput" />
<button id="sendBtn" disabled>Send File</button>
<p>Progress: <span id="progress">0%</span></p>
<div id="result"></div>
<div id="chatLog"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script type="module">
  import { connect } from "./src/webrtc/peerClient.js";

  const params = new URLSearchParams(location.search);
  const roomId = params.get("room") || "default-room";
  document.getElementById("room").textContent = roomId;

  const statusEl = document.getElementById("status");
  const progressEl = document.getElementById("progress");
  const resultEl = document.getElementById("result");
  const chatLogEl = document.getElementById("chatLog");
  const sendBtn = document.getElementById("sendBtn");
  const fileInput = document.getElementById("fileInput");

  function randomBytes(size) {
    const bytes = new Uint8Array(size);
    const maxChunk = 65536;
    for (let i = 0; i < size; i += maxChunk) {
      crypto.getRandomValues(bytes.subarray(i, Math.min(i + maxChunk, size)));
    }
    return bytes;
  }

  // Builds a syntactically real PDF (valid %PDF header, catalog/pages/page objects,
  // a content stream filled with random bytes, trailer/EOF) at roughly the requested size.
  function buildRandomPdf(totalSize) {
    const footer = "\nendstream\nendobj\ntrailer\n<< /Size 5 /Root 1 0 R >>\n%%EOF";
    const footerBytes = new TextEncoder().encode(footer);
    const headerPrefix =
      "%PDF-1.4\n" +
      "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n" +
      "2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n" +
      "3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << >> /Contents 4 0 R >>\nendobj\n" +
      "4 0 obj\n<< /Length ";
    const headerSuffix = " >>\nstream\n";

    const overheadEstimate = new TextEncoder().encode(headerPrefix + "00000000" + headerSuffix).length + footerBytes.length;
    const payloadSize = Math.max(0, totalSize - overheadEstimate);
    const header = headerPrefix + payloadSize + headerSuffix;
    const headerBytes = new TextEncoder().encode(header);
    const payload = randomBytes(payloadSize);

    const out = new Uint8Array(headerBytes.length + payload.length + footerBytes.length);
    out.set(headerBytes, 0);
    out.set(payload, headerBytes.length);
    out.set(footerBytes, headerBytes.length + payload.length);

    return new File([out], "random-test.pdf", { type: "application/pdf" });
  }

  const client = connect({
    serverUrl: "http://localhost:4000",
    roomId,
    onStatus: (s) => {
      statusEl.textContent = s;
      window.__status = s;
      if (s === "connected") sendBtn.disabled = false;
    },
    onProgress: (p) => {
      progressEl.textContent = Math.round(p * 100) + "%";
    },
    onFileReceived: (blob, meta) => {
      window.__lastReceivedBlob = blob;
      window.__lastReceivedMeta = meta;
      window.__receivedHash = meta.actualHash;
      window.__integrityOk = meta.integrityOk;
      resultEl.textContent =
        `Received: ${meta.name} (${meta.size} bytes) sha256=${meta.actualHash} integrityOk=${meta.integrityOk}`;

      if (meta.integrityOk && meta.mimeType === "application/pdf") {
        client.sendText("pdf file is received correctly");
      }
    },
    onText: (text) => {
      window.__lastReceivedText = text;
      const line = document.createElement("div");
      line.textContent = "peer says: " + text;
      chatLogEl.appendChild(line);
    },
  });

  sendBtn.onclick = () => {
    const file = fileInput.files[0];
    if (file) client.sendFile(file);
  };

  // Debug helper: generates a random in-memory PDF-format file and sends it.
  // sendFile() itself computes and embeds the sha256 (see fileTransfer.js), which
  // is what the receiver uses to self-verify integrity before replying.
  window.__sendRandomPdf = async (sizeBytes) => {
    const file = buildRandomPdf(sizeBytes);
    window.__sentSize = file.size;
    window.__sentHash = await client.sendFile(file);
    return window.__sentHash;
  };

  // Kept for earlier raw-binary tests.
  window.__sendRandomTestFile = async (sizeBytes) => {
    const bytes = randomBytes(sizeBytes);
    const file = new File([bytes], "random-test.bin", { type: "application/octet-stream" });
    window.__sentSize = sizeBytes;
    window.__sentHash = await client.sendFile(file);
    return window.__sentHash;
  };
</script>
</body>
</html>
